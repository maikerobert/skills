name: Checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portability
        run: bash portable-code-standard/scripts/check-portability.sh --all
      - name: ShellCheck
        run: shellcheck -S warning portable-code-standard/scripts/*.sh
      - name: Python syntax
        run: python3 -m py_compile web-launch-standard/scripts/check-page.py
